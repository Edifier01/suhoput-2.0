name: suhoput2-local
services:
  db:
    image: mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: suhoput
      MARIADB_USER: suhoput
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:?Generate infra/.env.local first}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?Generate infra/.env.local first}
    volumes:
      - db:/var/lib/mysql
    networks: [local]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:8ecd8d8e374167ea22235acf30f80d1165b82f07ffa5bcef90c1cad8f7be251f
    depends_on:
      db:
        condition: service_healthy
    environment: &wp-environment
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: suhoput
      WORDPRESS_DB_USER: suhoput
      WORDPRESS_DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('DISALLOW_FILE_MODS', true);
        define('SUHOPUT_EXTERNAL_WRITES_ENABLED', false);
        define('SUHOPUT_LOCAL_SAFETY', true);
        define('SUHOPUT_SYSTEM_QUEUE_ENABLED', true);
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - ../wp-content/plugins/suhoput-core:/var/www/html/wp-content/plugins/suhoput-core
      - ../wp-content/plugins/suhoput-moysklad:/var/www/html/wp-content/plugins/suhoput-moysklad
      - ../wp-content/themes/suhoput:/var/www/html/wp-content/themes/suhoput
      - ./local-safety.php:/var/www/html/wp-content/mu-plugins/suhoput-local-safety.php:ro
    networks: [local]
  cli:
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    user: "33:33"
    profiles: [tools]
    environment:
      <<: *wp-environment
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Generate infra/.env.local first}
    volumes:
      - wordpress:/var/www/html
      - ../wp-content/plugins/suhoput-core:/var/www/html/wp-content/plugins/suhoput-core
      - ../wp-content/plugins/suhoput-moysklad:/var/www/html/wp-content/plugins/suhoput-moysklad
      - ../wp-content/themes/suhoput:/var/www/html/wp-content/themes/suhoput
      - ./local-safety.php:/var/www/html/wp-content/mu-plugins/suhoput-local-safety.php:ro
      - ../.cache/packages:/packages:ro
      - ../tests:/tests:ro
      - ./bootstrap.sh:/bootstrap.sh:ro
    networks: [local]
  scheduler:
    extends:
      service: cli
    profiles: [queue]
    restart: unless-stopped
    init: true
    entrypoint: [sh, /queue-loop.sh]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./queue-loop.sh:/queue-loop.sh:ro
  mailpit:
    image: axllent/mailpit:v1.29.2@sha256:030f06031ce5c60913ac9363da1ab0d4be6fd2a78147dd0e1ca0fcac665d6b34
    networks: [local]
  proxy:
    image: nginx:1.28.2-alpine@sha256:5b4900b042ccfa8b0a73df622c3a60f2322faeb2be800cbee5aa7b44d241649e
    depends_on: [wordpress, mailpit]
    ports: ["127.0.0.1:18880:80", "127.0.0.1:18881:8081"]
    volumes:
      - ./local-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [local, edge]
networks:
  local:
    internal: true
  edge: {}
volumes:
  db:
  wordpress:
